name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  schedule:
    # Weekly full run on main, so a broken dependency or browser change is caught even without new commits.
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build site
        env:
          # A placeholder form ID lets the form tests run before Formspree is configured.
          ZERONE_FORMSPREE_FORM_ID: ${{ vars.FORMSPREE_FORM_ID || 'testform' }}
        run: python build.py
      - name: Static checks (links, SEO tags, hreflang, CSP, secrets)
        run: python tests/validate_site.py
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
        working-directory: tests
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - name: Browser and accessibility tests
        run: npx playwright test
        working-directory: tests
      - name: Lighthouse (performance, accessibility, best practices, SEO)
        run: npx lhci autorun
        working-directory: tests
      # The live site ships with the AI assistant switched off (the run above). This builds it once more
      # with the widget switched on and a fake endpoint, and runs the browser tests that cover it,
      # including the page checks and axe on every page with the chat button present.
      - name: Build with the AI assistant switched on (test endpoint)
        env:
          ZERONE_FORMSPREE_FORM_ID: ${{ vars.FORMSPREE_FORM_ID || 'testform' }}
          ZERONE_ASSISTANT_ENDPOINT: https://assistant.test.invalid
          ZERONE_ASSISTANT_TURNSTILE_SITEKEY: 1x00000000000000000000AA
        run: python build.py && python tests/validate_site.py
      - name: Browser tests with the AI assistant switched on
        run: npx playwright test e2e/assistant.spec.js e2e/a11y.spec.js
        working-directory: tests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            tests/playwright-report/
            lighthouse-report/
          retention-days: 7
          if-no-files-found: ignore

  cross-browser:
    name: Firefox and Safari (WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py
        env:
          ZERONE_FORMSPREE_FORM_ID: ${{ vars.FORMSPREE_FORM_ID || 'testform' }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
        working-directory: tests
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: tests
      - run: npx playwright test --project=firefox --project=webkit --project=mobile-safari
        working-directory: tests
        env:
          ALL_BROWSERS: "1"

  worker:
    # Unit tests of the AI assistant's Cloudflare Worker (mocked Anthropic client, no network).
    name: Assistant Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Is there a Worker?
        id: exists
        run: if [ -f worker/assistant/package.json ]; then echo "worker=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v7
        if: steps.exists.outputs.worker == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/assistant/package-lock.json
      - run: npm ci
        if: steps.exists.outputs.worker == 'true'
        working-directory: worker/assistant
      - run: npm test
        if: steps.exists.outputs.worker == 'true'
        working-directory: worker/assistant

  docker:
    name: Railway image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t zerone-site:ci .
      - name: Smoke test (health, headers, redirects, 404, caching)
        run: tests/docker-smoke.sh zerone-site:ci

  notify-failure:
    # Telegram alert when the scheduled weekly run, or a run on main, fails. Pull request and
    # feature-branch failures show up on the pull request itself, so they stay quiet.
    # Skipped silently when the TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are missing.
    name: Telegram alert on failure
    needs: [test, cross-browser, worker, docker]
    if: failure() && (github.event_name == 'schedule' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Send the Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST: ${{ needs.test.result }}
          CROSS: ${{ needs.cross-browser.result }}
          DOCKER: ${{ needs.docker.result }}
          WORKER: ${{ needs.worker.result }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then title="Haftalık otomatik test BAŞARISIZ"; else title="Ana daldaki (main) testler BAŞARISIZ"; fi
          {
            echo "Tetikleyen: $GITHUB_EVENT_NAME, dal: $GITHUB_REF_NAME, commit: ${GITHUB_SHA:0:7}"
            echo "Derleme ve testler: $TEST"
            echo "Firefox ve Safari testleri: $CROSS"
            echo "Railway imajı: $DOCKER"
            echo "AI asistan Worker testleri: $WORKER"
            echo "(success = başarılı, failure = başarısız, skipped = atlandı)"
            echo "Canlı site bu kontrolden etkilenmez; bu yalnızca erken bir uyarıdır. Claude'a haber verin."
            echo "Ayrıntılar: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } | python3 deploy/notify_telegram.py --title "$title"
