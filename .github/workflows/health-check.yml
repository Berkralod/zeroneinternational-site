name: Live site health check

# Every hour: loads every page of https://zeroneinternational.com and checks tags, redirects
# and the TLS certificate. A failed check is retried once after 90 seconds to rule out a blip.
#
# When the site is failing:
#   - the first failing run opens a GitHub issue (label "health-check") and sends a Telegram alert;
#   - while it keeps failing, the issue gets a new report and Telegram a reminder at most every
#     6 hours (measured from the issue's last report), so neither inbox is flooded hourly;
#   - runs that send an alert are marked failed; the quiet runs in between only show a warning.
# On the next healthy run the issue is closed and Telegram gets a "recovered" message.
# Telegram is optional: without the TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets it is skipped.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the live site
        id: check
        run: |
          set +e
          python3 deploy/health_check.py > report.txt 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            cat report.txt
            echo "Problems found; checking again in 90 seconds to rule out a short blip."
            sleep 90
            python3 deploy/health_check.py > report.txt 2>&1
            status=$?
          fi
          cat report.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Open or update the alert issue
        id: alert
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker='<!-- health-check-alert -->'
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # shellcheck disable=SC2016  # the backticks are a literal Markdown code fence
          body="$(printf '%s\nThe hourly health check found problems (run: %s).\n\n```\n%s\n```\n' "$marker" "$run_url" "$(cat report.txt)")"
          number="$(gh issue list --state open --label health-check --json number --jq '.[0].number')"
          notify=none
          if [ -z "$number" ]; then
            gh label create health-check --color B60205 --description "Live site health check" 2>/dev/null || true
            issue_url="$(gh issue create --title "Live site health check failed" --label health-check --body "$body")"
            notify=new
          else
            issue_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/$number"
            # Time of the last report: the newest comment carrying the marker, else the issue itself.
            last="$(gh issue view "$number" --json createdAt,comments \
              --jq '[.createdAt] + [.comments[] | select(.body | contains("health-check-alert")) | .createdAt] | max' || true)"
            last_epoch=0
            if [ -n "$last" ]; then last_epoch="$(date -u -d "$last" +%s 2>/dev/null || echo 0)"; fi
            age=$(( $(date -u +%s) - last_epoch ))
            # 5 h 45 min instead of 6 h, so a few minutes of schedule delay do not push it to 7 h.
            if [ "$age" -ge 20700 ]; then
              gh issue comment "$number" --body "$body"
              notify=reminder
            else
              echo "::warning::Site still failing; issue #$number was updated $(( age / 60 )) min ago, next reminder after 6 h."
            fi
          fi
          echo "notify=$notify" >> "$GITHUB_OUTPUT"
          echo "issue_url=$issue_url" >> "$GITHUB_OUTPUT"

      - name: Telegram alert
        if: steps.check.outputs.status != '0' && steps.alert.outputs.notify != 'none'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY: ${{ steps.alert.outputs.notify }}
          ISSUE_URL: ${{ steps.alert.outputs.issue_url }}
        run: |
          if [ "$NOTIFY" = new ]; then
            title="Site health check FAILING"
          else
            title="Site still failing (6-hour reminder)"
          fi
          {
            grep -E '^(Checked|[0-9]+ problem)' report.txt || true
            grep -E '^- ' report.txt | head -n 15 || true
            echo
            echo "Issue: $ISSUE_URL"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } | python3 deploy/notify_telegram.py --title "$title"

      - name: Mark the run as failed when an alert was sent
        if: steps.check.outputs.status != '0' && steps.alert.outputs.notify != 'none'
        run: exit 1

      - name: Close the alert issue when healthy again
        id: recover
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          closed=""
          for number in $(gh issue list --state open --label health-check --json number --jq '.[].number'); do
            gh issue close "$number" --comment "The site is healthy again (run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            closed="$closed #$number"
          done
          echo "closed=$closed" >> "$GITHUB_OUTPUT"

      - name: Telegram "recovered" message
        if: steps.check.outputs.status == '0' && steps.recover.outputs.closed != ''
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOSED: ${{ steps.recover.outputs.closed }}
        run: |
          {
            grep -E '^Checked' report.txt || true
            echo "All checks pass again; closed issue$CLOSED."
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } | python3 deploy/notify_telegram.py --title "Site recovered"
