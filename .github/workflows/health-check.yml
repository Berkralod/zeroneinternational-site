name: Live site health check

# Every day: loads every page of https://zeroneinternational.com and checks tags, redirects
# and the TLS certificate. A problem opens (or updates) a GitHub issue, which e-mails the owner;
# the issue closes itself on the next healthy run.

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the live site
        id: check
        run: |
          set +e
          python3 deploy/health_check.py | tee report.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Open or update the alert issue
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(printf 'The daily health check found problems (run: %s/%s/actions/runs/%s).\n\n```\n%s\n```\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(cat report.txt)")"
          number="$(gh issue list --state open --label health-check --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh label create health-check --color B60205 --description "Live site health check" 2>/dev/null || true
            gh issue create --title "Live site health check failed" --label health-check --body "$body"
          fi
          exit 1
      - name: Close the alert issue when healthy again
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for number in $(gh issue list --state open --label health-check --json number --jq '.[].number'); do
            gh issue close "$number" --comment "The site is healthy again (run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          done
