name: Static site checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python validate_site.py
      - run: python build_all.py
      - run: python -m pip install 'playwright>=1.45,<2'
      - run: python -m playwright install --with-deps chromium
      - run: python browser_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: browser-artifacts/
          retention-days: 7
          if-no-files-found: warn
